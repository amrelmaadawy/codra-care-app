name: medical_erp
description: CodraCare Medical ERP — Flutter Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Error Handling
  dartz: ^0.10.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Localization
  easy_localization: ^3.0.7+1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Env
  flutter_dotenv: ^5.2.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # Document, PDF & Share
  pdf: ^3.11.3
  printing: ^5.13.4
  share_plus: ^10.1.2
  path_provider: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - .env
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
